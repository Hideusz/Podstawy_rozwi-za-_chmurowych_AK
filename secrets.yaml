# Pusty plik sekretów dla SOPS
# Ten plik jest wymagany przez data source "sops_file"
#
# Aby dodać sekrety:
# 1. Skopiuj secrets_example.yaml
# 2. Edytuj sekrety
# 3. Zaszyfruj przez SOPS: sops -e secrets.yaml > secrets.enc.yaml
# 4. Zastąp: mv secrets.enc.yaml secrets.yaml
# 5. Odkomentuj mapowanie w sops.tf

# Przykład struktury (po zaszyfrowaniu):
# devops_sp_username: ENC[AES256_GCM,data:...,tag:...]
# devops_sp_password: ENC[AES256_GCM,data:...,tag:...]
